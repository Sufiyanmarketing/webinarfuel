<script>
(function(){
  var p = new URLSearchParams(location.search);

  // ===== WEBINAR SCHEDULE: every Sunday 10:00 Europe/Oslo =====
  var WBN_DAY  = 0;  // 0=Sunday
  var WBN_HOUR = 10; // 10:00

  // Name from URL
  try {
    var n = p.get('navn') || p.get('first_name') || p.get('name') || p.get('fornavn');
    if(n){ n = n.trim().split(' ')[0].replace(/[<>]/g,'');
      if(n) document.getElementById('tyName').textContent = ', ' + n.charAt(0).toUpperCase() + n.slice(1); }
  } catch(e){}

  // WebinarFuel join + calendar links (sent from the registration page)
  var joinLink = p.get('join_link');
  var calLink  = p.get('cal_link');

  // Join button: always the personal WebinarFuel link. No link = hide button.
  var joinBtnEl = document.getElementById('tyJoinBtn');
  if(joinBtnEl){
    if(joinLink){ joinBtnEl.href = joinLink; }
    else { joinBtnEl.style.display = 'none'; }
  }

  // ===== Auto-rolling next Sunday at 10:00 Oslo =====
  function getOsloOffset(d) {
    var utc = new Date(d.toLocaleString('en-US', {timeZone: 'UTC'}));
    var oslo = new Date(d.toLocaleString('en-US', {timeZone: 'Europe/Oslo'}));
    return oslo - utc;
  }
  function getNextWebinar() {
    var now = new Date();
    var offset = getOsloOffset(now);
    var osloNow = new Date(now.getTime() + offset);
    var daysUntil = (WBN_DAY - osloNow.getUTCDay() + 7) % 7;
    if (daysUntil === 0 && osloNow.getUTCHours() >= WBN_HOUR) daysUntil = 7;
    var osloMidnight = Date.UTC(osloNow.getUTCFullYear(), osloNow.getUTCMonth(), osloNow.getUTCDate());
    var osloTarget = new Date(osloMidnight + daysUntil * 86400000 + WBN_HOUR * 3600000);
    var approxUTC = new Date(osloTarget.getTime() - offset);
    var finalOffset = getOsloOffset(approxUTC);
    return new Date(osloTarget.getTime() - finalOffset);
  }
  function fmtIcsUTC(date){
    function pad(n){ return String(n).padStart(2, '0'); }
    return date.getUTCFullYear() + pad(date.getUTCMonth() + 1) + pad(date.getUTCDate())
      + 'T' + pad(date.getUTCHours()) + pad(date.getUTCMinutes()) + pad(date.getUTCSeconds()) + 'Z';
  }

  var months_lower = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
  var target = getNextWebinar();
  var fmt = new Intl.DateTimeFormat('en-US', {timeZone:'Europe/Oslo', day:'numeric', month:'numeric'});
  var pp = {};
  fmt.formatToParts(target).forEach(function(x){ pp[x.type] = x.value; });
  var day = parseInt(pp.day);
  var month = parseInt(pp.month) - 1;

  // Update date labels
  function setText(id, txt){ var el = document.getElementById(id); if(el) el.textContent = txt; }
  setText('tyDateInline', 'søndag ' + day + '. ' + months_lower[month] + ' kl. 10');
  setText('tyDatePill', 'Søndag ' + day + '. ' + months_lower[month]);
  setText('tyTimePill', 'kl. 10:00');
  setText('tyCalText', 'Søndag ' + day + '. ' + months_lower[month] + ' kl. 10 — sett av en time, så du ikke går glipp av det.');
  setText('tySeesDay', 'Vi sees søndag!');
  var seesBottom = document.getElementById('tySeesBottom');
  if(seesBottom) seesBottom.innerHTML = 'Vi sees<br>søndag!';

  // Calendar: WebinarFuel cal_link if available, else Google Calendar link
  var calEl = document.getElementById('tyCal');
  if(calEl){
    if(calLink){
      calEl.href = calLink;
    } else {
      var tyEnd = new Date(target.getTime() + 75 * 60000);
      var details = 'Live foredrag med naprapat Maiken Lund.\n'
        + (joinLink ? 'Bli med her: ' + joinLink + '\n' : 'Lenken til foredraget finner du på e-post.\n')
        + '\nTa med penn og papir til Ryggtesten.';
      calEl.href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('Prinsipper for en sterkere rygg — gratis live foredrag')
        + '&dates=' + fmtIcsUTC(target) + '/' + fmtIcsUTC(tyEnd)
        + '&details=' + encodeURIComponent(details)
        + (joinLink ? '&location=' + encodeURIComponent(joinLink) : '');
    }
  }
})();
</script>
